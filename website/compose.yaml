name: surau-payment-website

services:
  payment-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: surau-payment-website:local
    container_name: surau-payment-website
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3003
    ports:
      - "${WEB_PORT:-3003}:3003"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
